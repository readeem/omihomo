name: Package

# Builds the release tarball and the Arch package from it, then installs that
# package in a clean Arch container and checks what it installed. CI runs it
# on every change so a tag never finds a broken package; the release workflow
# publishes what it produces.
on:
  workflow_call:
    outputs:
      version:
        description: manifest.json's version, which the tarball and the package carry
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      sha256: ${{ steps.build.outputs.sha256 }}
      epoch: ${{ steps.build.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
      # gVisor is what TUN without redirect needs, as in mihomo's own
      # releases. no_easytier drops the one outbound that JITs, which the
      # unit's MemoryDenyWriteExecute= would kill. The tarball is built from
      # the commit alone, so building one commit again gives the same bytes.
      # The vendor tarball is the dependencies' source the GPL asks for, and
      # their notices ship with the binary.
      - name: build
        id: build
        run: |
          version=$(jq -r .version manifest.json)
          [[ $version =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo "manifest.json version $version is not X.Y.Z"; exit 1; }
          name=omihomo-$version
          stage=dist/$name
          mkdir -p "$stage"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_gvisor,no_easytier -trimpath \
            -ldflags "-s -w -X github.com/readeem/omihomo/internal/cli.Version=v$version" \
            -o "$stage/omihomo" ./cmd/omihomo
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' \
            -o "$stage/omihomo-update" ./cmd/omihomo-update
          install -m755 "$stage/omihomo-update" "dist/omihomo-update-$version-x86_64"
          install -m644 packaging/omihomo.service packaging/omihomo.socket packaging/omihomo.tmpfiles packaging/omihomo-apply.path packaging/omihomo-apply.service LICENSE "$stage/"
          go mod vendor -o dist/vendor
          (cd dist && find vendor -type f \( -name 'LICEN[CS]E*' -o -name 'COPYING*' -o -name 'NOTICE*' -o -name 'PATENTS*' \) |
            LC_ALL=C sort | while read -r f; do printf '==> %s <==\n' "${f#vendor/}"; cat "$f"; echo; done) > "$stage/THIRD_PARTY_LICENSES"
          epoch=$(git log -1 --format=%ct)
          pack() { tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -C dist -cf - "$1" | gzip -n > "dist/$2"; }
          pack "$name" "$name-x86_64.tar.gz"
          pack vendor "$name-vendor.tar.gz"
          rm -r "$stage" dist/vendor
          (cd dist && for f in "$name-x86_64.tar.gz" "$name-vendor.tar.gz" "omihomo-update-$version-x86_64"; do sha256sum "$f" > "$f.sha256"; done)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/$name-x86_64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 7

  arch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      SOURCE_DATE_EPOCH: ${{ needs.build.outputs.epoch }}
    steps:
      - name: install tools
        run: pacman -Syu --noconfirm --needed base-devel namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # makepkg finds the tarball in its build directory, so nothing is
      # downloaded and the checksum is checked against the file the release
      # will publish.
      - name: render the PKGBUILD
        run: |
          mkdir build
          cp packaging/PKGBUILD packaging/omihomo.install "dist/omihomo-$VERSION-x86_64.tar.gz" build/
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^sha256sums=.*/sha256sums=('$SHA256')/" build/PKGBUILD
          grep -qx "pkgver=$VERSION" build/PKGBUILD
          grep -qx "sha256sums=('$SHA256')" build/PKGBUILD
          useradd --create-home builder
          chown -R builder: build
      - name: build the package
        run: |
          runuser -u builder -- env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" sh -c 'cd build && makepkg --nodeps'
          package="omihomo-$VERSION-1-x86_64.pkg.tar.zst"
          namcap build/PKGBUILD "build/$package"
          cp "build/$package" dist/
          (cd dist && sha256sum "$package" > "$package.sha256")
      # Outside a booted systemd the install script can only enable the units,
      # which is what this checks along with the files themselves. The
      # threshold is the unit's exposure, 2.8, so loosening the sandbox fails.
      - name: install and check the package
        run: |
          pacman -U --noconfirm "build/omihomo-$VERSION-1-x86_64.pkg.tar.zst"
          cmp /usr/bin/omihomo-update "dist/omihomo-update-$VERSION-x86_64"
          omihomo version | grep -q "^omihomo v$VERSION "
          grep -q '^==> github.com/metacubex/mihomo/LICENSE <==$' /usr/share/licenses/omihomo/THIRD_PARTY_LICENSES
          systemctl is-enabled omihomo.socket omihomo.service
          test -f /usr/lib/systemd/user/omihomo-apply.path
          test -f /usr/lib/systemd/user/omihomo-apply.service
          runtime=$(mktemp -d)
          trap 'rm -r -- "$runtime"' EXIT
          XDG_RUNTIME_DIR="$runtime" systemd-analyze --user verify /usr/lib/systemd/user/omihomo-apply.path /usr/lib/systemd/user/omihomo-apply.service
          systemd-analyze verify /usr/lib/systemd/system/omihomo.socket /usr/lib/systemd/system/omihomo.service
          systemd-analyze security --offline=yes --threshold=28 /usr/lib/systemd/system/omihomo.service
          pacman -R --noconfirm omihomo
          test ! -e /etc/systemd/system/multi-user.target.wants/omihomo.service
          test ! -e /etc/systemd/system/sockets.target.wants/omihomo.socket
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-package
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
          retention-days: 7
