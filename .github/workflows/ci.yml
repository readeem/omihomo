name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod names the patch release, so builds and govulncheck use at
      # least the standard library it was checked against.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet -tags with_gvisor ./...
      # mihomo races with itself (its log level, delay history and health
      # checks share unguarded state), so its package runs without -race.
      - name: go test
        run: |
          go test -race $(go list ./... | grep -v /internal/core/mihomo$)
          go test -tags with_gvisor ./internal/core/mihomo
      # Official mihomo releases build with gVisor, which TUN without
      # redirect needs.
      - name: build
        run: CGO_ENABLED=0 go build -tags with_gvisor -trimpath -o /dev/null ./cmd/omihomo
      # A replace only applies in the main module, so ours copies mihomo's;
      # a bump that changes theirs must change ours.
      - name: mihomo replace
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          upstream=$(go mod download -json "github.com/metacubex/mihomo@$version" | jq -r .GoMod)
          diff <(go mod edit -json "$upstream" | jq -S .Replace) <(go mod edit -json | jq -S .Replace)
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  widget:
    runs-on: ubuntu-latest
    # Arch packages Quickshell, the runtime the QML service tests need.
    container: archlinux:base@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    steps:
      - name: install tools
        run: pacman -Syu --noconfirm --needed git nodejs jq go-yq curl quickshell
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Omarchy shell imports Service.qml uses, from the release the
      # widget targets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          ref: c668141e9c42b13c80c9ca4ea108e11708c5e8a5 # v4.0.4
          path: .omarchy
          sparse-checkout: shell/Commons
          persist-credentials: false
      - name: install Omarchy shell imports
        run: |
          install -d /usr/share/omarchy/shell
          cp -r .omarchy/shell/Commons /usr/share/omarchy/shell/
          rm -rf .omarchy
      # As an ordinary account, the way the suites run on a desktop.
      - name: tests/run
        run: |
          useradd --create-home tester
          chown -R tester: .
          runuser -u tester -- env OMIHOMO_REQUIRE_QML=1 ./tests/run
