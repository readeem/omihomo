[settings]
lockfile = true

[tool_config]
locked = true

[tools]
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
# The release build: gVisor for TUN without redirect, and no EasyTier, which JITs.
GOFLAGS = "-tags=with_gvisor,no_easytier"

[tasks.check]
description = "The gate: formatting, go fix, vet and tests"
run = [
  'test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }',
  "go fix -diff ./...",
  "go vet ./...",
  "GOFLAGS= go vet ./...",
  # mihomo races with itself, so its package runs without -race.
  "go test -race $(go list ./... | grep -v '/internal/core/mihomo$')",
  "go test ./internal/core/mihomo",
]

[tasks.widget]
description = "Installer, widget model and Quickshell service tests against fake daemons"
run = "./tests/run"

[tasks.vulncheck]
description = "Scan the release build for reachable vulnerabilities"
run = "govulncheck -tags with_gvisor,no_easytier ./..."

[tasks.security]
description = "Signed bootstrap/release tests and isolated privileged package adapter tests"
run = ["./tests/install_test.sh", "./tests/release_test.sh", "./tests/package_boundary_test.sh"]

[tasks.fix]
description = "Apply go fix and gofmt"
run = ["go fix ./...", "gofmt -w ."]

[tasks.package]
description = "Build the Arch package into dist/"
run = "./tools/build-package"

[tasks.release]
description = "Set the version, tag it on next and push both, e.g. mise run release 1.2.3"
usage = 'arg "<version>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { printf '%s\n' "$1" >&2; exit 1; }
version=${usage_version#v}
tag=v$version
[[ $version =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || fail "$usage_version is not X.Y.Z"
[[ $(git branch --show-current) == next ]] || fail "releases are cut from next"
[[ -z $(git status --porcelain) ]] || fail "the working tree is not clean"
git fetch --quiet origin next release
[[ $(git rev-parse HEAD) == "$(git rev-parse origin/next)" ]] || fail "next differs from origin/next; pull or push first"
# The release workflow refuses a tag that release cannot fast-forward to.
git merge-base --is-ancestor origin/release HEAD || fail "next does not descend from release"
! git show-ref --verify --quiet "refs/tags/$tag" || fail "$tag already exists locally"
[[ -z $(git ls-remote --tags origin "refs/tags/$tag") ]] || fail "$tag already exists"
current=$(jq -r .version manifest.json)
(( $(vercmp "$version" "$current") >= 0 )) || fail "$version is older than manifest.json's $current"
# A failed push leaves next and the tags as they were, so a rerun starts clean.
start=$(git rev-parse HEAD)
pushed=false
tagged=false
trap '$pushed || { if $tagged; then git tag -d "$tag" >/dev/null 2>&1; fi; git reset --quiet --hard "$start"; }' EXIT
if [[ $version != "$current" ]]; then
  jq --arg version "$version" '.version = $version' manifest.json > manifest.json.new
  mv manifest.json.new manifest.json
  git commit --quiet -m "chore(release): $version" manifest.json
fi
git tag -a "$tag" -m "$tag"
tagged=true
git push --atomic origin HEAD:refs/heads/next "refs/tags/$tag"
pushed=true
printf 'Pushed %s. Approve the deployment once CI passes: gh run watch\n' "$tag"
'''
